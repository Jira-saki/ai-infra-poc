apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-inference-quarantine
  namespace: default
spec:
  podSelector:
    matchLabels:
      quarantine: "true"
  policyTypes:
    - Ingress
    - Egress
  # Default Deny: ไม่ประกาศ Ingress/Egress rule ใดๆ ส่งผลให้ Drop ทราฟฟิกทุกทิศทางทันที
